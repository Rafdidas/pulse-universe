name: Release

# Pushing a tag such as v0.1.0 builds the Windows zip and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag name
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not of the form vMAJOR.MINOR.PATCH"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}

      - name: Make the cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Install the frontend packages
        working-directory: web
        run: npm ci

      - name: Test the frontend
        working-directory: web
        run: npm test

      - name: Typecheck the frontend
        working-directory: web
        run: npm run typecheck

      - name: Lint the frontend
        working-directory: web
        run: npm run lint

      - name: Build the exe (not yet signed)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/package.ps1 -Version $version -SkipNpmCi -Phase Build

      # The next two steps run only once the SignPath application is approved and the repository
      # variable SIGNPATH_ORGANIZATION_ID is set (docs/signing-setup.md). Without it the release
      # ships the unsigned exe, as before.
      - name: Upload the unsigned exe
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-pulse-engine
          path: dist-release/unsigned/pulse-engine.exe

      - name: Sign the exe with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          artifact-configuration-slug: '${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: dist-release/signed

      - name: Assemble the release files
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($env:SIGNING_ENABLED -ne '') {
            $signed = @(Get-ChildItem dist-release/signed -Recurse -Filter pulse-engine.exe)
            if ($signed.Count -ne 1) { throw "expected exactly one signed pulse-engine.exe, found $($signed.Count)" }
            ./scripts/package.ps1 -Version $version -Phase Assemble -ExePath $signed[0].FullName -RequireSignature
          } else {
            ./scripts/package.ps1 -Version $version -Phase Assemble -ExePath dist-release/unsigned/pulse-engine.exe
          }

      - name: Test the engine (the ETW tests skip without administrator rights)
        run: engine/build-release/tests/Release/pulse-tests.exe

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist-release -File |
            Where-Object { $_.Name -like 'pulse-universe-*' -or $_.Name -like 'pulse-engine.exe*' } |
            ForEach-Object { $_.FullName }
          if (@($files).Count -ne 4) { throw "expected 4 release files, found $(@($files).Count): $($files -join ', ')" }
          gh release create $env:GITHUB_REF_NAME $files --title $env:GITHUB_REF_NAME --generate-notes
